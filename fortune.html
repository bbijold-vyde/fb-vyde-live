<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blackwood Fortune</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root { --ink:#1a1612; --ivory:#f6f1e8; --stone:#e6dfd2; --gold:#8d7344; --muted:#6f675c; --wine:#7a3030; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { min-height:100vh; display:flex; flex-direction:column; background:radial-gradient(circle at top, #2a241c 0%, #100e0c 55%); color:var(--ivory); font-family:'Inter',system-ui,sans-serif; }
    main { width:min(460px, calc(100% - 2rem)); margin:auto; padding:3rem 0; text-align:center; }
    .mark { font-family:'Cormorant Garamond',Georgia,serif; font-weight:500; letter-spacing:.42em; font-size:.78rem; color:var(--gold); text-transform:uppercase; }
    h1 { font-family:'Cormorant Garamond',Georgia,serif; font-weight:500; font-size:4.4rem; line-height:.9; letter-spacing:.02em; margin:.85rem 0 .4rem; }
    .rule { width:72px; height:1px; background:var(--gold); margin:1.1rem auto; }
    .deck { color:#d9d0c2; font-family:'Cormorant Garamond',Georgia,serif; font-style:italic; font-size:1.35rem; }
    form { margin-top:2rem; background:var(--ivory); color:var(--ink); text-align:left; padding:1.75rem 1.6rem 1.5rem; box-shadow:0 24px 60px rgba(0,0,0,.35); }
    label { display:block; font-size:.68rem; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); margin:1rem 0 .4rem; }
    label:first-of-type { margin-top:0; }
    input { width:100%; background:transparent; color:var(--ink); border:0; border-bottom:1px solid #c9bfae; padding:.55rem 0; font:inherit; border-radius:0; }
    input:focus { outline:none; border-bottom-color:var(--gold); }
    button { margin-top:1.4rem; width:100%; background:var(--ink); color:var(--ivory); border:0; padding:.85rem 1rem; letter-spacing:.18em; text-transform:uppercase; font-size:.72rem; cursor:pointer; }
    button:hover { background:#2c261f; }
    .refusal { margin-top:1rem; color:var(--wine); font-size:.92rem; }
    .locked { margin-top:.8rem; color:var(--muted); font-size:.85rem; }
    footer { text-align:center; padding:1.5rem 1rem 2rem; color:#8d8478; font-size:.72rem; letter-spacing:.14em; text-transform:uppercase; }
    @media (max-width:600px) { h1 { font-size:3.2rem; } }
  </style>
</head>
<body>
  <main>
    <p class="mark">Private office</p>
    <h1>Blackwood<br>Fortune</h1>
    <div class="rule"></div>
    <p class="deck">The books and the messages of the Remainder.</p>
    <form id="door">
      <label for="who">Name</label>
      <input id="who" name="who" autocomplete="off">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="off">
      <button type="submit">Enter</button>
      <p id="refusal" class="refusal" role="alert" hidden>Access refused. The books and the messages remain sealed.</p>
      <p class="locked">The password slip has not been issued.</p>
    </form>
  </main>
  <footer>Blackwood Remainder · By appointment</footer>
  <script>
    document.getElementById("door").addEventListener("submit", function (event) {
      event.preventDefault();
      var note = document.getElementById("refusal");
      var password = document.getElementById("password");
      note.hidden = false;
      password.value = "";
      password.focus();
    });
  </script>
</body>
</html>
